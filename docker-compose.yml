services:
  app:
    build:
      context: .
    volumes:
      - .:/var/www/html
    ports:
      - "8000:8000"              
    networks:
      - starter-pack-network
    depends_on:
      - db
      - redis

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: StarterPack
      POSTGRES_USER: root
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - starter-pack-network

  redis:
    image: redis:alpine
    networks:
      - starter-pack-network
    volumes:
      - redisdata:/data 

networks:
  starter-pack-network:

volumes:
  pgdata:
  redisdata: